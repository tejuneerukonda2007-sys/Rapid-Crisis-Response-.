<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapid Crisis Response</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(to right, #ff4e50, #f9d423);
    color: white;
    margin: 0;
    padding: 20px;
}

h1 {
    margin-top: 20px;
}

button {
    padding: 20px 50px;
    font-size: 26px;
    background-color: #ff0000;
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 30px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

button:hover {
    background-color: #cc0000;
}

#status {
    margin-top: 20px;
    font-size: 18px;
}

#map {
    margin-top: 20px;
    width: 100%;
    height: 300px;
    border-radius: 10px;
    overflow: hidden;
}

.card {
    background: rgba(255,255,255,0.2);
    padding: 20px;
    border-radius: 15px;
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>🚨 Rapid Crisis Response</h1>
<p>Tap SOS in case of emergency</p>

<button onclick="sendSOS()">SOS</button>

<div class="card">
    <p id="status">Waiting for action...</p>
</div>

<div id="map"></div>

<script>
function sendSOS() {
    if (navigator.geolocation) {
        document.getElementById("status").innerText = "📍 Getting your location...";
        navigator.geolocation.getCurrentPosition(showPosition, showError);
    } else {
        document.getElementById("status").innerText = "❌ Geolocation not supported.";
    }
}

function showPosition(position) {
    let lat = position.coords.latitude;
    let lon = position.coords.longitude;

    document.getElementById("status").innerHTML =
        "✅ SOS Sent!<br>Latitude: " + lat.toFixed(5) +
        "<br>Longitude: " + lon.toFixed(5);

    document.getElementById("map").innerHTML =
        `<iframe width="100%" height="300"
        src="https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed"
        frameborder="0"></iframe>`;
}

function showError(error) {
    let message = "";
    switch(error.code) {
        case error.PERMISSION_DENIED:
            message = "❌ Permission denied. Please allow location access.";
            break;
        case error.POSITION_UNAVAILABLE:
            message = "❌ Location unavailable.";
            break;
        case error.TIMEOUT:
            message = "❌ Request timed out.";
            break;
        default:
            message = "❌ Unknown error occurred.";
    }
    document.getElementById("status").innerText = message;
}
</script>

</body>
</html>
